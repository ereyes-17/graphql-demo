apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: graphql-demo
spec:
  replicas: 1 
  selector:
    matchLabels:
      app.kubernetes.io/instance: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-demo
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
          name: web
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: graphql-demo
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: graphql-demo
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: graphql-demo
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-persistent-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
